plugins {
    id 'idea'
    id 'maven-publish'
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

repositories {
    mavenLocal()
    flatDir { dir '.libs' }

    maven {
        name = "Parchment"
        url = "https://maven.parchmentmc.org"
    }

    maven {
        name = "Ladysnake"
        url = "https://maven.ladysnake.org/releases"
    }

    maven {
        name = "TerraformersMC"
        url = "https://maven.terraformersmc.com/"
    }

    //jei
    maven {
        url = "https://maven.blamejared.com/"
    }

    //modrinth (tiny-multiblock-lib, trinkets, forge-config-api-port, cardinal-components, etc.)
    maven {
        url = "https://api.modrinth.com/maven"
    }

    //tyson the ember (libtooltips facade dependency, see FABRIC_PORT_PLAN.md §7bis.1)
    maven { url = 'https://maven.tysontheember.dev' }

    exclusiveContent {
        forRepository {
            maven { url = "https://cursemaven.com" }
        }
        filter { includeGroup "curse.maven" }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft_version}:${parchment_mappings_version}@zip")
    }

    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    //javax.annotation.Nullable/Nonnull (JSR-305) — used pervasively by the original Forge source,
    //no longer pulled in transitively now that the real Forge/NeoForge dependency is gone
    compileOnly "com.google.code.findbugs:jsr305:3.0.2"

    //attachments (replaces NeoBackports AttachmentType/Capability shim, see FABRIC_PORT_PLAN.md §5.5)
    modImplementation "dev.onyxstudios.cardinal-components-api:cardinal-components-base:${cardinal_components_version}"
    modImplementation "dev.onyxstudios.cardinal-components-api:cardinal-components-entity:${cardinal_components_version}"

    //config (keeps SCConfig's ForgeConfigSpec builder code unchanged, see FABRIC_PORT_PLAN.md §1 D3)
    modImplementation "maven.modrinth:forge-config-api-port:${forge_config_api_port_version}"

    //curios replacement, see FABRIC_PORT_PLAN.md §1 D5
    modImplementation "dev.emi:trinkets:${trinkets_version}"

    //tiny multiblock lib (official Fabric build, drop-in — FABRIC_PORT_PLAN.md §7bis.2)
    modImplementation(include("maven.modrinth:tiny-multiblock-lib:${tiny_multiblock_lib_version}"))

    //mixin
    modImplementation("io.github.llamalad7:mixinextras-fabric:${mixinextras_version}")
    include("io.github.llamalad7:mixinextras-fabric:${mixinextras_version}")
    annotationProcessor "io.github.llamalad7:mixinextras-fabric:${mixinextras_version}"

    //compat modules (§8) — all soft/optional, compileOnly + isModLoaded-guarded at the call site
    modCompileOnly "mezz.jei:jei-1.20.1-fabric-api:${jei_version}"
    modCompileOnly "maven.modrinth:emi:${emi_version}"
    modCompileOnly "maven.modrinth:serene-seasons:${serene_seasons_version}"
    modCompileOnly "maven.modrinth:iris:${iris_version}"
    modCompileOnly "curse.maven:ftb-teams-fabric-438497:${ftb_teams_fabric_file}"
    //Ecliptic Seasons, TerraFirmaCraft, Quality Food and Reliquified Artifacts have no Fabric 1.20.1
    //build at all (confirmed 2026-09-01) — those compat classes are gated off, not ported, see §8.
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

// Mojang ships Java 17 to end users in 1.20.1, so mods should target Java 17.
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

tasks.withType(JavaCompile).configureEach {
    it.options.release = 17
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xmaxerrs' << '10000'
}

loom {
    accessWidenerPath = file("src/main/resources/starcatcher.accesswidener")

    runs {
        client {
            client()
        }
        server {
            server()
            programArg '--nogui'
        }
        data {
            client()
            configName = "Data Generation"
            source sourceSets.main
            vmArg "-Dfabric-api.datagen"
            vmArg "-Dfabric-api.datagen.output-dir=${file("src/generated/resources")}"
            vmArg "-Dfabric-api.datagen.modid=${mod_id}"

            runDir "build/datagen"
        }
    }
}

fabricApi {
    configureDataGeneration {
        client = true
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

processResources {
    inputs.property "version", project.version
    inputs.property "mod_id", mod_id
    inputs.property "mod_name", mod_name
    inputs.property "mod_license", mod_license
    inputs.property "mod_authors", mod_authors
    inputs.property "mod_description", mod_description

    filesMatching("fabric.mod.json") {
        expand(
                version: project.version,
                mod_id: mod_id,
                mod_name: mod_name,
                mod_license: mod_license,
                mod_authors: mod_authors,
                mod_description: mod_description,
        )
    }
}

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
